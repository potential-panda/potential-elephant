[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "yahoo-finance-bbs-scraper"
version = "0.1.0"
description = "A robust, headless scraping pipeline for Yahoo Japan Finance BBS comments and evaluations."
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "playwright>=1.40.0",
    "playwright-stealth>=2.0.2",
    "duckdb>=1.0.0",
    "pandas>=2.0.0",
    "pyarrow>=14.0.0",
    "schedule>=1.2.0",
    "potential-panda-core @ git+ssh://git@github.com/potential-panda/potential-panda-core.git@main",
]

[project.scripts]
yahoo-scrape = "cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["*"]
